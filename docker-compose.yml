version: "3.8"

services:
  certmate:
    build:
      context: .certmate
      dockerfile: Dockerfile
    container_name: cambridge-certmate
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=sqlite:////data/certmate.db
    volumes:
      - certmate-data:/data
      - certmate-certs:/certificates
    networks:
      - cambridge-platform
    restart: unless-stopped

  inventory-agent:
    build:
      context: .inventorymanagement
      dockerfile: src/Agent/Dockerfile
    container_name: cambridge-inventory
    ports:
      - "5001:5001"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=db;Database=InventoryDB;User=sa;Password=YourStrong@Passw0rd
    depends_on:
      - db
    networks:
      - cambridge-platform
    restart: unless-stopped

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cambridge-db
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong@Passw0rd
    volumes:
      - mssql-data:/var/opt/mssql
    networks:
      - cambridge-platform
    restart: unless-stopped

  api-gateway:
    build:
      context: platform/api-gateway
      dockerfile: Dockerfile
    container_name: cambridge-gateway
    ports:
      - "8080:8080"
    environment:
      - CERTMATE_URL=http://certmate:5000
      - INVENTORY_URL=http://inventory-agent:5001
    depends_on:
      - certmate
      - inventory-agent
    networks:
      - cambridge-platform
    restart: unless-stopped

  web-ui:
    build:
      context: platform/web-ui
      dockerfile: Dockerfile
    container_name: cambridge-ui
    ports:
      - "3000:80"
    environment:
      - REACT_APP_API_GATEWAY=http://localhost:8080/api
    depends_on:
      - api-gateway
    networks:
      - cambridge-platform
    restart: unless-stopped

volumes:
  certmate-data:
  certmate-certs:
  mssql-data:

networks:
  cambridge-platform:
    driver: bridge
