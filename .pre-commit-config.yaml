# Pre-commit hooks for linting and type checking
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.10
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        additional_dependencies: []
        args: [--config-file=mypy.ini]

  - repo: local
    hooks:
      - id: dotnet-format-inventorymanagement
        name: dotnet format (InventoryManagement)
        entry: dotnet format whitespace .inventorymanagement/InventoryManagement.sln --verify-no-changes
        language: system
        pass_filenames: false
        files: ^\.inventorymanagement/.*\.(cs|csproj|sln)$