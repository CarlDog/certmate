[mypy]
python_version = 3.10
warn_return_any = False
warn_unused_configs = True
ignore_missing_imports = True
disallow_untyped_defs = False
disallow_incomplete_defs = False
check_untyped_defs = False
no_implicit_optional = False
warn_redundant_casts = False
warn_unused_ignores = False
warn_no_return = True

# Suppress specific error codes that require significant refactoring
[mypy-modules.core.private_ca]
ignore_errors = True

[mypy-modules.core.csr_handler]
ignore_errors = True

[mypy-modules.core.ca_manager]
ignore_errors = True

[mypy-modules.core.shell]
ignore_errors = True

[mypy-modules.core.dns_strategies]
ignore_errors = True

[mypy-modules.core.utils]
ignore_errors = True

[mypy-modules.core.client_certificates]
ignore_errors = True

[mypy-modules.core.structured_logging]
ignore_errors = True

[mypy-modules.api.resources]
ignore_errors = True

[mypy-test_all_endpoints]
ignore_errors = True

[mypy-test_e2e_real]
ignore_errors = True

[mypy-test_route53_cert]
ignore_errors = True

[mypy-test_dns_provider_detection]
ignore_errors = True
