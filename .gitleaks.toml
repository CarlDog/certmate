# Gitleaks configuration for certmate
# https://github.com/gitleaks/gitleaks

title = "certmate gitleaks config"

[extend]
useDefault = true

[allowlist]
  description = "Global allowlist for known false positives"

  paths = [
    '''\.gitleaks\.toml$''',
    '''\.gitignore$''',
    '''\.env\.example$''',
    '''(^|/)\.?venv/''',
    '''(^|/)node_modules/''',
  ]

  regexTarget = "match"
  regexes = [
    '''Bearer\s+(test|example|your)[A-Za-z0-9_-]*''',
    '''rfc2136_secret''',
    '''(godaddy|porkbun|vultr|dme|ns1|console)[-_].*\d{3,}''',
    '''mount_point''',
  ]
